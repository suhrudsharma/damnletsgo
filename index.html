<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Mobile-first, PWA-safe -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">

    <title>DamnLetsGo</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/854/854878.png">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Routing -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- App CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= SEARCH ================= -->
<div class="search-container">
    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>

        <!-- GLOBAL SEARCH READY -->
        <input
            type="text"
            id="search-input"
            placeholder="Search places worldwide..."
            autocomplete="off"
            onkeyup="app.handleSearch()"
        >

        <i class="fa-solid fa-xmark clear-icon hidden" id="clear-search" onclick="app.clearSearch()"></i>
    </div>

    <!-- Will later show geocoding results -->
    <div id="search-results" class="search-results hidden"></div>
</div>

<!-- ================= DASHBOARD ================= -->
<div class="dashboard-container" id="dashboard">

    <!-- Drag Handle -->
    <div class="drag-handle">
        <div class="handle-bar"></div>
    </div>

    <div class="dashboard-content">

        <!-- HEADER -->
        <div class="header-row">
            <h1 id="app-title">DamnLetsGo</h1>

            <!-- ROUTING MODE (GLOBAL NOW, CAMPUS LATER) -->
            <div class="toggle-wrapper hidden" id="routing-mode-toggle">
                <span class="toggle-label">Campus Mode</span>
                <label class="switch">
                    <input type="checkbox" disabled>
                    <span class="slider round"></span>
                </label>
            </div>
        </div>

        <!-- ================= TRAVEL MODES ================= -->
        <div class="travel-modes">
            <button class="t-btn active" data-profile="foot" onclick="app.setTravelMode('walk', this)">
                <i class="fa-solid fa-person-walking"></i>
                <span>Walk</span>
            </button>

            <button class="t-btn" data-profile="bike" onclick="app.setTravelMode('cycle', this)">
                <i class="fa-solid fa-bicycle"></i>
                <span>Cycle</span>
            </button>

            <button class="t-btn" data-profile="driving" onclick="app.setTravelMode('bike', this)">
                <i class="fa-solid fa-motorcycle"></i>
                <span>Bike</span>
            </button>

            <button class="t-btn" data-profile="driving" onclick="app.setTravelMode('car', this)">
                <i class="fa-solid fa-car"></i>
                <span>Car</span>
            </button>
            <div class="campus-toggle">
  <button id="campusToggle" class="campus-btn">
    Campus Mode: OFF
  </button>
</div>

        </div>

        <!-- ================= STATUS ================= -->
        <div id="selection-status" class="status-text">
            Search or tap places to start
        </div>

        <!-- ================= ACTIONS ================= -->
        <div class="action-row">
            <button class="btn btn-primary" onclick="app.calculateRoute()">
                <i class="fa-solid fa-diamond-turn-right"></i>
                Navigate
            </button>

            <button class="btn btn-secondary" onclick="app.resetApp()">

                <i class="fa-solid fa-rotate-left"></i>
                Reset
            </button>
        </div>

        <!-- ================= RESULTS ================= -->
        <div id="results-area" class="results-box hidden">
            <div class="stat-item">
                <div class="stat-label">Distance</div>
                <div class="stat-value" id="dist-val">0 km</div>
            </div>

            <div class="stat-item">
                <div class="stat-label">Est. Time</div>
                <div class="stat-value" id="time-val">0 min</div>
            </div>

            <div class="algo-badge" id="algo-badge">Optimized Route</div>
        </div>

        <!-- ================= EDIT CONTROLS (GLOBAL OFF) ================= -->
        <div id="edit-controls" class="hidden">
            <!-- Intentionally hidden in global mode -->
        </div>

    </div>
</div>

<!-- ================= MAP CONTROLS ================= -->
<div class="map-controls">
    <div class="d-pad">
        <button class="d-up" onclick="app.panMap(0, -80)"><i class="fa-solid fa-chevron-up"></i></button>
        <button class="d-left" onclick="app.panMap(-80, 0)"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="d-center" onclick="app.resetView()"><i class="fa-solid fa-crosshairs"></i></button>
        <button class="d-right" onclick="app.panMap(80, 0)"><i class="fa-solid fa-chevron-right"></i></button>
        <button class="d-down" onclick="app.panMap(0, 80)"><i class="fa-solid fa-chevron-down"></i></button>
    </div>

    <div class="zoom-pad">
        <button onclick="app.zoomMap(1)"><i class="fa-solid fa-plus"></i></button>
        <button onclick="app.zoomMap(-1)"><i class="fa-solid fa-minus"></i></button>
    </div>
</div>

<!-- ================= TOAST ================= -->
<div id="toast">Message</div>

<!-- ================= MAP ================= -->
<div id="map"></div>

<!-- ================= SCRIPTS ================= -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
<script src="app.js"></script>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(console.error);
    }
</script>

</body>
</html>
