<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <title>DamnLetsGo</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/854/854878.png">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SEARCH BAR -->
    <div class="search-container">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="search-input" placeholder="Search places..." onkeyup="app.handleSearch()">
            <i class="fa-solid fa-xmark clear-icon hidden" id="clear-search" onclick="app.clearSearch()"></i>
        </div>
        <div id="search-results" class="search-results hidden"></div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div class="dashboard-container" id="dashboard">
        <!-- Drag Handle -->
        <div class="drag-handle" onclick="app.toggleDashboard()">
            <div class="handle-bar"></div>
        </div>

        <div class="dashboard-content">
            <div class="header-row">
                <h1 id="app-title">DamnLetsGo</h1>
                <!-- Edit Toggle (Subtle) -->
                <div class="toggle-wrapper">
                    <span class="toggle-label">Edit Map</span>
                    <label class="switch">
                        <input type="checkbox" id="edit-mode-toggle" onchange="app.toggleEditMode()">
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>

            <!-- TRAVEL MODES -->
            <div class="travel-modes">
                <button class="t-btn active" onclick="app.setTravelMode('walk', this)">
                    <i class="fa-solid fa-person-walking"></i> <span>Walk</span>
                </button>
                <button class="t-btn" onclick="app.setTravelMode('cycle', this)">
                    <i class="fa-solid fa-bicycle"></i> <span>Cycle</span>
                </button>
                <button class="t-btn" onclick="app.setTravelMode('bike', this)">
                    <i class="fa-solid fa-motorcycle"></i> <span>Bike</span>
                </button>
                <button class="t-btn" onclick="app.setTravelMode('car', this)">
                    <i class="fa-solid fa-car"></i> <span>Car</span>
                </button>
            </div>

            <!-- STATUS & ACTIONS -->
            <div id="selection-status" class="status-text">Select venues to start</div>

            <div class="action-row">
                <button class="btn btn-primary" onclick="app.calculateRoute()">
                    <i class="fa-solid fa-diamond-turn-right"></i> Navigate
                </button>
                <button class="btn btn-secondary" onclick="app.clearSelection()">
                    <i class="fa-solid fa-rotate-left"></i> Reset
                </button>
            </div>

            <!-- RESULTS AREA -->
            <div id="results-area" class="results-box hidden">
                <div class="stat-item">
                    <div class="stat-label">Distance</div>
                    <div class="stat-value" id="dist-val">0 km</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Est. Time</div>
                    <div class="stat-value" id="time-val">0 min</div>
                </div>
                <div class="algo-badge" id="algo-badge">Optimized Route</div>
            </div>
            
            <!-- ADMIN CONTROLS (Hidden by default) -->
            <div id="edit-controls" class="hidden" style="margin-top:15px; border-top:1px solid #eee; padding-top:10px;">
                <p style="font-size:0.8rem; color:#666; margin-bottom:5px;">Tap map to add points</p>
                <button class="btn btn-danger small" onclick="app.clearAllData()">Delete All Venues</button>
            </div>
        </div>
    </div>

    <!-- MANUAL CONTROLS -->
    <div class="map-controls">
        <div class="d-pad">
            <button class="d-up" onclick="app.panMap(0, -80)"><i class="fa-solid fa-chevron-up"></i></button>
            <div class="d-middle">
                <button class="d-left" onclick="app.panMap(-80, 0)"><i class="fa-solid fa-chevron-left"></i></button>
                <button class="d-center" onclick="app.resetView()" title="Center Map"><i class="fa-solid fa-crosshairs"></i></button>
                <button class="d-right" onclick="app.panMap(80, 0)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <button class="d-down" onclick="app.panMap(0, 80)"><i class="fa-solid fa-chevron-down"></i></button>
        </div>
        <div class="zoom-pad">
            <button onclick="app.zoomMap(1)"><i class="fa-solid fa-plus"></i></button>
            <button onclick="app.zoomMap(-1)"><i class="fa-solid fa-minus"></i></button>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast">Message</div>

    <!-- MAP -->
    <div id="map"></div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <script src="app.js"></script>
    
    <script>
        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Fail', err));
        }
    </script>
</body>
</html>
